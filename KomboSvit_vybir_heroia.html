<body><div class="wrap">
<header class="top"><div class="brand"><div class="logo">🌌</div><div><h1>КомбоСвіт</h1><p>Створи героя · Налаштуй світ · Відкрий усі комбінації</p></div></div><div class="pill" id="phase">Пролог</div></header>
<div class="progress"><div class="progressline"><span id="progressText">Пригода ще не почалася</span><b id="progressPct">0%</b></div><div class="bar"><span id="barFill"></span></div></div>

<section class="panel side"><h3>🗺️ Карта пригоди</h3><p class="note" id="mapDesc">Спочатку обери героя.</p><div class="map" id="map"></div></section>
</aside></div><div class="footer">Кожен вибір створює нові можливості. Рахуй, досліджуй і перемагай! ✨</div></div>

{title:"Зала випробувань",emoji:"🚪",story:"Охоронець перевіряє, чи вмієш ти поєднувати кілька категорій і враховувати заборонені набори.",kind:"hall"},

gear:[["shields","Щитів",[2,3,4,5],3],["weapons","Видів зброї",[2,3,4],2],["amulets","Амулетів",[2,3,4],2]],
potion:[["bases","Основ еліксирів",[2,3,4,5],3],["additives","Добавок",[2,3,4,5,6],4]],

case"route":a=d.roads*d.paths;q=`Є ${d.roads} дороги до мосту та ${d.paths} шляхи від мосту до замку. Скільки повних маршрутів ведуть від старту до замку через міст?`;ex=`${d.roads} × ${d.paths} = ${a} маршрутів.`;hint="Кожна дорога до мосту поєднується з кожним шляхом від мосту.";visual=routeVisual(d.roads,d.paths);break;
case"gear":a=d.shields*d.weapons*d.amulets;q=`Є ${d.shields} щити, ${d.weapons} види зброї та ${d.amulets} амулети. Скільки комплектів можна зібрати, якщо взяти по одному предмету кожного виду?`;ex=`${d.shields} × ${d.weapons} × ${d.amulets} = ${a} комплектів.`;hint="Спочатку поєднай щит зі зброєю, а потім кожну пару — з кожним амулетом.";visual=`🛡️ ${d.shields} щити　⚔️ ${d.weapons} види зброї　📿 ${d.amulets} амулети`;break;
case"potion":a=d.bases*d.additives;q=`Є ${d.bases} основи та ${d.additives} добавок. Кожен еліксир має одну основу й одну добавку. Скільки різних рецептів можна скласти?`;ex=`${d.bases} × ${d.additives} = ${a} рецептів.`;hint="Кожну основу можна поєднати з кожною добавкою.";visual=`🧪 ${d.bases} основ × ${d.additives} добавок`;break;
case"team":a=choose(d.friends,d.team);q=`Є ${d.friends} друзів. Треба запросити ${d.team}. Скільки різних команд можна скласти, якщо порядок не має значення?`;ex=`C(${d.friends}, ${d.team}) = ${a} команд.`;hint="Не рахуй ту саму команду двічі лише через зміну порядку. Використай кількість способів вибрати групу.";visual=`🧑‍🤝‍🧑 ${d.friends} друзів · команда з ${d.team}`;break;
case"island":a=d.ferries*d.trails*d.passes;q=`Є ${d.ferries} переправи, ${d.trails} стежки та ${d.passes} гірські проходи. Скільки повних маршрутів існує, якщо треба пройти всі три етапи?`;ex=`${d.ferries} × ${d.trails} × ${d.passes} = ${a} маршрутів.`;hint="Кожен вибір на першому етапі можна поєднати з кожним вибором другого й третього етапів.";visual=`⛵ ${d.ferries} переправи → 🌿 ${d.trails} стежки → ⛰️ ${d.passes} проходи`;break;
case"shop":a=d.bags*d.amulets-d.blocked;q=`Є ${d.bags} сумки та ${d.amulets} амулети. ${d.blocked} комплекти недоступні. Скільки доступних комплектів залишилося?`;ex=`${d.bags} × ${d.amulets} − ${d.blocked} = ${a} комплектів.`;hint="Спочатку порахуй усі пари, а потім відніми недоступні комплекти.";visual=`🎒 ${d.bags} сумки × 📿 ${d.amulets} амулети · ⛔ ${d.blocked} заборонено`;break;
case"missions":a=d.missions*d.methods;q=`Є ${d.missions} місії, і кожну можна виконати ${d.methods} способами. Скільки пар «місія — спосіб» існує?`;ex=`${d.missions} × ${d.methods} = ${a} пар.`;hint="Для кожної місії є всі доступні способи виконання.";visual=`📜 ${d.missions} місії · 🛠️ ${d.methods} способи для кожної`;break;
case"hall":a=d.heroes*d.places*d.artifacts-d.blocked;q=`Є ${d.heroes} герої, ${d.places} локації та ${d.artifacts} артефакти. ${d.blocked} набори зайняті. Скільки доступних наборів залишилося?`;ex=`${d.heroes} × ${d.places} × ${d.artifacts} − ${d.blocked} = ${a}.`;hint="Перемнож кількості в усіх трьох категоріях, а потім відніми зайняті набори.";visual=`🧙 ${d.heroes} герої × 🗺️ ${d.places} локації × 💎 ${d.artifacts} артефакти · ⛔ ${d.blocked}`;break;
case"final":a=d.heroes*d.worlds*d.artifacts-d.blocked;q=`Є ${d.heroes} герої, ${d.worlds} світи та ${d.artifacts} артефакти. ${d.blocked} набори заборонені. Скільки наборів можна використати?`;ex=`${d.heroes} × ${d.worlds} × ${d.artifacts} − ${d.blocked} = ${a} наборів.`;hint="Порахуй усі можливі набори з трьох категорій, а потім виключи заборонені.";visual=`🧙 ${d.heroes} герої × 🌍 ${d.worlds} світи × 💎 ${d.artifacts} артефакти · ⛔ ${d.blocked}`;break}
return{question:q,answer:a,explain:ex,hint,visual}}
function routeVisual(a,b){let html='<div style="display:flex;justify-content:space-around;align-items:center;gap:8px;flex-wrap:wrap">';html+=`<div style="text-align:center">🏘️<br><b>Старт</b></div><div style="display:grid;gap:3px">${Array.from({length:a},(_,i)=>`<span class="badge">🛤️ Дорога ${i+1}</span>`).join("")}</div><div style="font-size:2rem">🌉</div><div style="display:grid;gap:3px">${Array.from({length:b},(_,i)=>`<span class="badge">➡️ Шлях ${i+1}</span>`).join("")}</div><div style="text-align:center">🏰<br><b>Замок</b></div></div>`;return html}
function victory(){$("main").innerHTML=banner("Скарб знайдено!","🏆","Ти пройшов усі випробування КомбоСвіту: сам задавав умови, рахував можливості й відкривав шлях до перемоги.","Фінал пригоди")+`<div class="two"><div class="avatarBox">${avatar()}<div class="avatarName">${S.hero.name} — герой КомбоСвіту</div></div><div><h3>Твої здобутки</h3><div class="statGrid"><div class="stat"><strong>${S.coins}</strong><small>кристалів</small></div><div class="stat"><strong>${S.keys}</strong><small>ключів</small></div><div class="stat"><strong>${S.done.length}/12</strong><small>рівнів</small></div></div><div class="story">Ти використав правило множення, перебір варіантів, вибір групи та врахування обмежень.</div></div></div><h3>🎪 Бонусна пригода: Шкільний фестиваль</h3><p>Тепер ти організатор фестивалю. Налаштуй кількість декорацій, ігор і призів, а потім сам введи відповіді.</p><div id="bonus"></div><div class="row" style="margin-top:14px"><button id="restart" class="btn soft">↻ Нова пригода</button><button id="editHero" class="btn primary">🎨 Змінити героя</button></div>`;
const bonus=[{title:"Дизайн плаката",emoji:"🎨",question:d=>`На плакаті буде ${d.colors} кольори та ${d.symbols} символи. Скільки різних дизайнів можна створити, обравши один колірний набір і один символ?`,fields:[["colors","Кольори",[2,3,4],3],["symbols","Символи",[2,3,4,5],2]],answer:d=>d.colors*d.symbols,explain:d=>`${d.colors} × ${d.symbols} = ${d.colors*d.symbols}.`},{title:"Фестиваль ігор",emoji:"🎲",question:d=>`На фестивалі є ${d.games} настільних ігор і ${d.prizes} види призів. Скільки пар «гра — приз» можна скласти?`,fields:[["games","Настільні ігри",[2,3,4,5],4],["prizes","Види призів",[2,3,4],3]],answer:d=>d.games*d.prizes,explain:d=>`${d.games} × ${d.prizes} = ${d.games*d.prizes}.`},{title:"Маршрут до сцени",emoji:"🎤",question:d=>`До площі ведуть ${d.entrances} входи, а від площі до сцени — ${d.walks} доріжки. Скільки різних маршрутів можна обрати, якщо пройти через площу?`,fields:[["entrances","Входи",[2,3,4],2],["walks","Доріжки",[2,3,4,5],4]],answer:d=>d.entrances*d.walks,explain:d=>`${d.entrances} × ${d.walks} = ${d.entrances*d.walks}.` }];
$("bonus").innerHTML=bonus.map((q,i)=>`<div class="question"><h3>${q.emoji} ${q.title}</h3><div class="grid">${q.fields.map(f=>`<div class="field"><label>${f[1]}</label><select class="select" id="bf_${i}_${f[0]}">${f[2].map(n=>`<option ${n===f[3]?"selected":""}>${n}</option>`).join("")}</select></div>`).join("")}</div><p id="bq_${i}">${q.question(Object.fromEntries(q.fields.map(f=>[f[0],f[3]])))}</p><button class="btn soft" data-bgen="${i}">Оновити завдання</button><div class="answerRow"><input class="answer" id="ba_${i}" type="number" placeholder="Твоя відповідь"><button class="btn primary" data-bcheck="${i}">Перевірити</button></div><div class="feedback" id="bfback_${i}"></div></div>`).join("");
bonus.forEach((q,i)=>{function data(){return Object.fromEntries(q.fields.map(f=>[f[0],+$("bf_"+i+"_"+f[0]).value]))}function refresh(){$("bq_"+i).textContent=q.question(data())}q.fields.forEach(f=>$("bf_"+i+"_"+f[0]).onchange=refresh);document.querySelector(`[data-bgen="${i}"]`).onclick=refresh;document.querySelector(`[data-bcheck="${i}"]`).onclick=()=>{let d=data(),f=$("bfback_"+i);if(+$("ba_"+i).value===q.answer(d)){f.className="feedback good";f.textContent="🎉 Правильно! "+q.explain(d);if(!S.bonus.includes(i)){S.bonus.push(i);S.coins+=5;side()}}else{f.className="feedback bad";f.textContent="Спробуй ще раз: помнож кількість варіантів."}}});
$("restart").onclick=()=>location.reload();$("editHero").onclick=()=>{S.screen="custom";render()}}
render();
})();
</script></body></html>
