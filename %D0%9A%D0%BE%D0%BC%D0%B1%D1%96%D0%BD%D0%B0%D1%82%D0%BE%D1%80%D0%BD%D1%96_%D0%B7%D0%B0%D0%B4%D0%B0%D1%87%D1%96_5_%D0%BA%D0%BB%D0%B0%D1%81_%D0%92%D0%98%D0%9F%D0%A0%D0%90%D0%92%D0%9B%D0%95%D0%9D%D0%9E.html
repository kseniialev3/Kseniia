<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Комбінаторні задачі — флешкартки, 5 клас</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b2843;background:#f3f5fb}*{box-sizing:border-box}body{margin:0}main{width:min(100% - 28px,790px);margin:0 auto;padding:24px 0 40px}h1{text-align:center;font-size:clamp(25px,4vw,35px);margin:5px 0 4px}header p{text-align:center;color:#66718a;margin:0 0 19px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.stat{background:#fff;border:1px solid #dfe3ef;border-radius:12px;padding:11px 4px;text-align:center;font-size:clamp(12px,2.2vw,16px)}.stat b{display:block;font-size:22px}.good{color:#15804a}.bad{color:#c3344e}.track{height:8px;border-radius:20px;background:#e1e5f1;margin:0 0 21px;overflow:hidden}.bar{height:100%;width:0;background:#5368d7;transition:width .25s}.flash{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center;width:100%;min-height:330px;background:#fff;border:2px solid #dce2f0;border-radius:22px;box-shadow:0 12px 28px #24385818;padding:35px 30px;cursor:pointer;color:inherit;transition:background .2s}.flash.revealed{background:#edf9f0;border-color:#b6dec4}.flash:focus-visible,button:focus-visible{outline:3px solid #6579dc;outline-offset:3px}.small{font-size:13px;color:#5165ba;font-weight:800;letter-spacing:.08em}.q{font-size:clamp(20px,3.2vw,29px);font-weight:750;line-height:1.42;max-width:670px;overflow-wrap:normal;word-break:normal;hyphens:none}.answer{font-size:clamp(30px,5vw,44px);font-weight:800;color:#147645}.explanation{font-size:clamp(16px,2.7vw,21px);line-height:1.48;max-width:660px}.help{font-size:14px;color:#6f7c97}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:19px}.btn{border:0;border-radius:13px;padding:16px 10px;font-weight:800;font-size:clamp(14px,2.6vw,19px);cursor:pointer}.btn:disabled{opacity:.38;cursor:not-allowed}.no{background:#fce5e9;color:#ad2544}.yes{background:#dff6e7;color:#08773c}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:19px}.minor{padding:11px 14px;border:1px solid #dce2f0;border-radius:11px;background:#fff;color:#344566;font-weight:700;cursor:pointer}.note{text-align:center;font-size:13px;color:#687995;margin-top:16px}.results{display:none;background:#fff;border-radius:18px;padding:32px 22px;text-align:center}.results h2{font-size:29px}.resultnum{font-size:54px;font-weight:850;color:#16804c}.missed{text-align:left;max-width:650px;margin:16px auto;line-height:1.7}.missed li{margin-bottom:8px}@media(max-width:520px){main{padding-top:12px}.flash{min-height:350px;padding:23px 19px}.stats{gap:6px}.stat b{font-size:19px}.controls{gap:8px}.btn{padding:16px 4px}}
</style></head><body><main><header><h1>Комбінаторні задачі 🎲</h1><p>5 клас · 15 флешкарток · без формул</p></header>
<section id="game"><div class="stats"><div class="stat">Картка <b id="idx">1/15</b></div><div class="stat good">Зійшлося <b id="yesCount">0 ✓</b></div><div class="stat bad">Не зійшлося <b id="noCount">0 ✕</b></div></div><div class="track"><div class="bar" id="bar"></div></div>
<button type="button" id="card" class="flash" aria-label="Перевернути картку"><span class="small" id="side">ЗАДАЧА</span><span class="q" id="question"></span><span class="answer" id="answer" hidden></span><span class="explanation" id="explanation" hidden></span><span class="help" id="hint">Натисни на картку, щоб побачити відповідь</span></button>
<div class="controls"><button class="btn no" id="no" disabled>✕ Не зійшлося</button><button class="btn yes" id="yes" disabled>✓ Зійшлося</button></div><div class="actions"><button class="minor" id="reset">↻ Почати спочатку</button><button class="minor" id="shuffle">⇄ Перемішати</button></div><p class="note">Спочатку розв’яжи задачу, потім перевір відповідь і вибери ✓ або ✕.</p></section>
<section class="results" id="results"><h2>Готово! 🌟</h2><p>Твої відповіді збіглися:</p><div class="resultnum" id="score"></div><div class="missed" id="missed"></div><button class="btn yes" id="again">↻ Пройти ще раз</button></section></main>
<script>
const original=[["У Марійки є 3 футболки й 2 спідниці. Скільки різних комплектів вона може скласти?", "6 комплектів", "До кожної з 3 футболок можна обрати одну з 2 спідниць: 3 · 2 = 6."], ["У кафе є 4 види соку та 2 види булочок. Скільки різних наборів «сік + булочка» можна вибрати?", "8 наборів", "Для кожного з 4 соків є 2 варіанти булочки: 4 · 2 = 8."], ["З цифр 1, 2, 3 склади двоцифрові числа без повторення цифр. Скільки їх?", "6 чисел", "12, 13, 21, 23, 31, 32."], ["Є 3 кольори олівців: синій, червоний, зелений. Скількома способами можна вибрати 2 олівці різних кольорів, якщо порядок неважливий?", "3 способи", "Синій і червоний; синій і зелений; червоний і зелений."], ["До школи ведуть 2 дороги, а від школи до парку — 3 стежки. Скільки різних маршрутів із дому до парку через школу?", "6 маршрутів", "Для кожної з 2 доріг можна вибрати 1 із 3 стежок: 2 · 3 = 6."], ["У коробці 4 різні значки. Скількома способами можна вибрати один значок у подарунок?", "4 способи", "Можна вибрати будь-який із чотирьох значків."], ["Із цифр 0, 4, 7 склади двоцифрові числа без повторення цифр. Скільки їх?", "4 числа", "40, 47, 70, 74. Нуль не може стояти першим."], ["У меню є 2 супи, 3 основні страви й 2 напої. Скільки обідів можна скласти, взявши по одному з кожної групи?", "12 обідів", "2 · 3 · 2 = 12 різних поєднань."], ["Троє друзів — Оля, Максим і Софія — сідають у ряд. Скільки різних порядків розсадження можливі?", "6 порядків", "ОМС, ОСМ, МОС, МСО, СОМ, СМО (за першими літерами імен)."], ["У Софії 2 різні шапки, 2 шарфи та 2 пари рукавичок. Скільки різних зимових комплектів можна скласти?", "8 комплектів", "2 · 2 · 2 = 8."], ["У спортивній команді 5 дітей. Скількома способами можна обрати капітана та його помічника, якщо це різні діти?", "20 способів", "Є 5 кандидатів у капітани й 4 — у помічники: 5 · 4 = 20."], ["Із букв А, Б, В склади двобуквені «слова» без повторення букв. Скільки різних записів вийде?", "6 записів", "АБ, АВ, БА, БВ, ВА, ВБ."], ["На полиці 4 різні книжки. Скількома способами можна вибрати 2 книжки, якщо порядок вибору неважливий?", "6 способів", "Пари книжок: 1–2, 1–3, 1–4, 2–3, 2–4, 3–4."], ["На прапорці дві горизонтальні смуги. Є 3 кольори. Смуги мають бути різних кольорів. Скільки прапорців можна зробити?", "6 прапорців", "3 кольори для верхньої смуги, 2 інші для нижньої: 3 · 2 = 6."], ["Є 4 різні листівки. Потрібно вибрати дві: одну для Анни, іншу для Богдана. Скільки способів це зробити?", "12 способів", "4 варіанти для Анни й 3 решти — для Богдана: 4 · 3 = 12."]];
let deck=[],i=0,yes=0,no=0,shown=false,mistakes=[];const $=id=>document.getElementById(id);
function start(shuffle=false){deck=original.map(x=>x.slice());if(shuffle){for(let n=deck.length-1;n>0;n--){let k=Math.floor(Math.random()*(n+1));[deck[n],deck[k]]=[deck[k],deck[n]]}}i=yes=no=0;mistakes=[];$('results').style.display='none';$('game').style.display='block';render()}
function render(){if(i===deck.length){$('game').style.display='none';$('results').style.display='block';$('score').textContent=yes+' / '+deck.length;$('missed').replaceChildren();if(mistakes.length){const h=document.createElement('p');h.textContent='Ці задачі можна повторити:';const ul=document.createElement('ol');for(const q of mistakes){const li=document.createElement('li');li.textContent=q;ul.append(li)}$('missed').append(h,ul)}return}shown=false;$('card').classList.remove('revealed');$('side').textContent='ЗАДАЧА';$('question').textContent=deck[i][0];$('question').hidden=false;$('answer').hidden=true;$('explanation').hidden=true;$('answer').textContent=deck[i][1];$('explanation').textContent=deck[i][2];$('hint').textContent='Натисни на картку, щоб побачити відповідь';$('idx').textContent=(i+1)+'/'+deck.length;$('yesCount').textContent=yes+' ✓';$('noCount').textContent=no+' ✕';$('bar').style.width=100*i/deck.length+'%';$('no').disabled=true;$('yes').disabled=true}
$('card').addEventListener('click',()=>{shown=!shown;$('card').classList.toggle('revealed',shown);$('side').textContent=shown?'ВІДПОВІДЬ':'ЗАДАЧА';$('question').hidden=shown;$('answer').hidden=!shown;$('explanation').hidden=!shown;$('hint').textContent=shown?'Познач, чи збіглася твоя відповідь':'Натисни на картку, щоб побачити відповідь';$('no').disabled=!shown;$('yes').disabled=!shown});
$('no').addEventListener('click',()=>{if(!shown)return;mistakes.push(deck[i][0]);no++;i++;render()});$('yes').addEventListener('click',()=>{if(!shown)return;yes++;i++;render()});$('reset').addEventListener('click',()=>start());$('shuffle').addEventListener('click',()=>start(true));$('again').addEventListener('click',()=>start());start();
</script></body></html>
